<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2e444f"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="70" font-size="40" font-weight="800" fill="#2e444f" letter-spacing="-1">DIAGRAMA DE CONTEXTO · UNIWAY</text>
  <rect x="40" y="88" width="120" height="6" fill="#8acdee"/>
  <text x="40" y="130" font-size="18" fill="#6e6e73">Quién usa el sistema y con qué sistemas externos intercambia información</text>

  <!-- Sistema central -->
  <rect x="640" y="200" width="320" height="600" fill="#2e444f"/>
  <rect x="640" y="200" width="320" height="10" fill="#8acdee"/>
  <text x="800" y="290" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">UniWay</text>
  <text x="800" y="325" font-size="17" fill="#c9dbe4" text-anchor="middle">Aplicación web para elegir</text>
  <text x="800" y="347" font-size="17" fill="#c9dbe4" text-anchor="middle">bachillerato en la ZMVM</text>
  <g font-size="18" fill="#ffffff" font-weight="600">
    <rect x="680" y="390" width="240" height="40" fill="#466778"/><text x="800" y="417" text-anchor="middle">Mapa de escuelas</text>
    <rect x="680" y="440" width="240" height="40" fill="#466778"/><text x="800" y="467" text-anchor="middle">Becas · Simulador</text>
    <rect x="680" y="490" width="240" height="40" fill="#466778"/><text x="800" y="517" text-anchor="middle">Cursos y asesorías</text>
    <rect x="680" y="540" width="240" height="40" fill="#466778"/><text x="800" y="567" text-anchor="middle">Compra y reembolsos</text>
    <rect x="680" y="590" width="240" height="40" fill="#466778"/><text x="800" y="617" text-anchor="middle">Mi perfil · Mis opciones</text>
  </g>
  <text x="800" y="700" font-size="16" fill="#8acdee" text-anchor="middle" font-weight="700">Next.js · publicada en Vercel</text>
  <text x="800" y="724" font-size="15" fill="#c9dbe4" text-anchor="middle">https://uniway-gold.vercel.app</text>

  <!-- Actores (izquierda) -->
  <g>
    <rect x="40" y="290" width="270" height="140" fill="#ffffff" stroke="#2e444f" stroke-width="4"/>
    <text x="175" y="345" font-size="24" font-weight="800" fill="#2e444f" text-anchor="middle">ESTUDIANTE</text>
    <text x="175" y="375" font-size="16" fill="#6e6e73" text-anchor="middle">3.º de secundaria</text>
    <text x="175" y="397" font-size="16" fill="#6e6e73" text-anchor="middle">(usuario principal)</text>
  </g>
  <g>
    <rect x="40" y="570" width="270" height="140" fill="#ffffff" stroke="#2e444f" stroke-width="4"/>
    <text x="175" y="625" font-size="24" font-weight="800" fill="#2e444f" text-anchor="middle">MAMÁ, PAPÁ</text>
    <text x="175" y="653" font-size="24" font-weight="800" fill="#2e444f" text-anchor="middle">O TUTOR</text>
    <text x="175" y="682" font-size="16" fill="#6e6e73" text-anchor="middle">(quien paga)</text>
  </g>

  <!-- Flechas actores -->
  <g stroke="#2e444f" stroke-width="3" fill="none">
    <line x1="312" y1="342" x2="636" y2="342" marker-end="url(#f)"/>
    <line x1="636" y1="380" x2="314" y2="380" marker-end="url(#f)"/>
    <line x1="312" y1="622" x2="636" y2="622" marker-end="url(#f)"/>
    <line x1="636" y1="660" x2="314" y2="660" marker-end="url(#f)"/>
  </g>
  <g font-size="15" fill="#1d1d1f">
    <text x="474" y="332" text-anchor="middle">Busca escuelas, guarda favoritas, simula</text>
    <text x="474" y="405" text-anchor="middle">Escuelas cercanas, becas, resultados</text>
    <text x="474" y="612" text-anchor="middle">Cotiza, paga, agenda y cancela</text>
    <text x="474" y="685" text-anchor="middle">Cotización, comprobante y reembolso</text>
  </g>

  <!-- Sistemas externos (derecha) -->
  <g>
    <rect x="1290" y="210" width="270" height="130" fill="#e8f4fb" stroke="#466778" stroke-width="3"/>
    <text x="1425" y="258" font-size="21" font-weight="800" fill="#2e444f" text-anchor="middle">SEP · MI DERECHO,</text>
    <text x="1425" y="284" font-size="21" font-weight="800" fill="#2e444f" text-anchor="middle">MI LUGAR</text>
    <text x="1425" y="315" font-size="15" fill="#466778" text-anchor="middle">Buscador oficial de escuelas</text>
  </g>
  <g>
    <rect x="1290" y="435" width="270" height="130" fill="#e8f4fb" stroke="#466778" stroke-width="3"/>
    <text x="1425" y="490" font-size="21" font-weight="800" fill="#2e444f" text-anchor="middle">OPENSTREETMAP</text>
    <text x="1425" y="520" font-size="15" fill="#466778" text-anchor="middle">Mapa base (mosaicos)</text>
    <text x="1425" y="542" font-size="15" fill="#466778" text-anchor="middle">licencia ODbL</text>
  </g>
  <g>
    <rect x="1290" y="660" width="270" height="130" fill="#ffffff" stroke="#466778" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="1425" y="712" font-size="21" font-weight="800" fill="#2e444f" text-anchor="middle">PASARELA DE PAGO</text>
    <text x="1425" y="742" font-size="15" fill="#466778" text-anchor="middle">Simulada en modo de prueba</text>
    <text x="1425" y="764" font-size="15" fill="#466778" text-anchor="middle">tarjeta y OXXO</text>
  </g>

  <!-- Flechas externos -->
  <g stroke="#2e444f" stroke-width="3" fill="none">
    <line x1="1288" y1="275" x2="964" y2="275" marker-end="url(#f)"/>
    <line x1="964" y1="482" x2="1286" y2="482" marker-end="url(#f)"/>
    <line x1="1288" y1="518" x2="964" y2="518" marker-end="url(#f)"/>
    <line x1="964" y1="707" x2="1286" y2="707" marker-end="url(#f)"/>
    <line x1="1288" y1="743" x2="964" y2="743" marker-end="url(#f)"/>
  </g>
  <g font-size="15" fill="#1d1d1f">
    <text x="1126" y="264" text-anchor="middle">553 planteles y 1,082 opciones</text>
    <text x="1126" y="300" text-anchor="middle" fill="#6e6e73">(extracción con script, nov. 2026)</text>
    <text x="1126" y="472" text-anchor="middle">Pide mosaicos de la zona</text>
    <text x="1126" y="543" text-anchor="middle">Imágenes del mapa</text>
    <text x="1126" y="697" text-anchor="middle">Cobro o reembolso</text>
    <text x="1126" y="768" text-anchor="middle">Aprobado / rechazado</text>
  </g>

  <!-- Enlaces externos (abajo) -->
  <rect x="580" y="860" width="440" height="110" fill="#f5f5f7" stroke="#466778" stroke-width="3"/>
  <text x="800" y="902" font-size="20" font-weight="800" fill="#2e444f" text-anchor="middle">SITIOS EXTERNOS (ENLACES)</text>
  <text x="800" y="930" font-size="15" fill="#466778" text-anchor="middle">Google Maps · Google Imágenes · TikTok</text>
  <text x="800" y="952" font-size="15" fill="#466778" text-anchor="middle">Portales de becas, IkniuM y academias</text>
  <line x1="800" y1="802" x2="800" y2="856" stroke="#2e444f" stroke-width="3" marker-end="url(#f)"/>
  <text x="815" y="836" font-size="15" fill="#1d1d1f">Rutas, fotos, videos y convocatorias</text>

  <!-- Leyenda -->
  <g font-size="14" fill="#6e6e73">
    <rect x="40" y="880" width="26" height="18" fill="#2e444f"/><text x="76" y="894">Sistema UniWay</text>
    <rect x="40" y="910" width="26" height="18" fill="#ffffff" stroke="#2e444f" stroke-width="3"/><text x="76" y="924">Usuario</text>
    <rect x="40" y="940" width="26" height="18" fill="#e8f4fb" stroke="#466778" stroke-width="2"/><text x="76" y="954">Sistema externo</text>
    <rect x="230" y="880" width="26" height="18" fill="#ffffff" stroke="#466778" stroke-width="2" stroke-dasharray="5 4"/><text x="266" y="894">Simulado</text>
    <line x1="230" y1="919" x2="256" y2="919" stroke="#2e444f" stroke-width="3" marker-end="url(#f)"/><text x="266" y="924">Flujo de datos</text>
  </g>
</svg>
